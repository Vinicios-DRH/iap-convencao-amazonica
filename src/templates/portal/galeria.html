<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeria — Portal</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/portal.css') }}" rel="stylesheet">
</head>

<body class="pt-body">
    {% include "portal/components/navbar.html" %}

    <main class="pt-main py-5">
        <div class="container">
            <h1 class="mb-4">Galeria</h1>

            {% if photos %}
            <div class="row g-3">
                {% for p in photos %}
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="pt-card overflow-hidden">
                        <img src="{{ get_b2_file_url(p.image_key) }}" alt="{{ p.caption or '' }}"
                            style="width:100%; height:180px; object-fit:cover;">
                        {% if p.caption %}
                        <div class="p-2 small pt-muted">{{ p.caption }}</div>
                        {% endif %}
                    </div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="pt-card p-4 pt-muted">Nenhuma foto publicada ainda.</div>
            {% endif %}
        </div>
    </main>

    {% include "portal/components/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
