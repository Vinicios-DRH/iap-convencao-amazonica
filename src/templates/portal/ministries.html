<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ministérios — Portal</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/portal.css') }}" rel="stylesheet">
</head>

<body class="pt-body">
    {% include "portal/components/navbar.html" %}

    <main class="pt-main py-5">
        <div class="container">
            <h1 class="mb-4">Ministérios</h1>

            {% if ministries %}
            <div class="row g-4">
                {% for ministry in ministries %}
                <div class="col-md-6 col-lg-4">
                    <a href="{{ url_for('portal_ministry_detail', slug=ministry.slug) }}"
                        class="text-decoration-none text-reset">
                        <div class="pt-card pt-card-link h-100 overflow-hidden post-card">
                            {% if ministry.cover_image_key %}
                            <img src="{{ get_b2_file_url(ministry.cover_image_key) }}" alt="{{ ministry.name }}">
                            {% endif %}
                            <div class="p-3">
                                <h5 class="mt-2">{{ ministry.name }}</h5>
                            </div>
                        </div>
                    </a>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="pt-card p-4 pt-muted">Nenhum ministério cadastrado ainda.</div>
            {% endif %}
        </div>
    </main>

    {% include "portal/components/footer.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
