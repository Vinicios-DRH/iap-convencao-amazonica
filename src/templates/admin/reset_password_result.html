<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Senha temporária — Administração</title>

    <link rel="icon" type="image/x-icon"
        href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --pink: #d946ef;
            --cyan: #22d3ee;
            --bg: #070711;
            --card: rgba(255, 255, 255, .07);
            --border: rgba(255, 255, 255, .15);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #fff;
            background:
                radial-gradient(800px 500px at 20% 10%, rgba(34, 211, 238, .20), transparent 60%),
                radial-gradient(800px 500px at 80% 20%, rgba(217, 70, 239, .22), transparent 60%),
                linear-gradient(180deg, #05050d, var(--bg));
        }

        .result-card {
            width: 100%;
            max-width: 650px;
            padding: 32px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
        }

        .success-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            color: #05050d;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--pink));
        }

        .password-box {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(34, 211, 238, .45);
            border-radius: 16px;
        }

        .password-value {
            flex: 1;
            margin: 0;
            overflow-wrap: anywhere;
            color: #fff;
            font-family: Consolas, Monaco, monospace;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 900;
            letter-spacing: .08em;
        }

        .btn-neon {
            color: #05050d;
            font-weight: 900;
            border: none;
            background: linear-gradient(90deg, var(--cyan), var(--pink));
        }

        .btn-neon:hover {
            color: #05050d;
            opacity: .92;
        }

        .text-muted-custom {
            color: rgba(255, 255, 255, .66);
        }
    </style>
</head>

<body>
    <div class="result-card">
        <div class="success-icon mb-4">✓</div>

        <h1 class="h3 fw-bold">Senha resetada com sucesso</h1>

        <p class="text-muted-custom">
            Foi criada uma senha temporária para
            <strong class="text-white">{{ usuario.email }}</strong>.
        </p>

        <div class="alert alert-warning">
            Esta senha será exibida somente nesta página. Copie antes de sair ou atualizar.
        </div>

        <label class="form-label fw-bold">Senha temporária</label>

        <div class="password-box">
            <code class="password-value" id="senhaTemporaria">{{ senha_temporaria }}</code>
            <button type="button" class="btn btn-neon" id="botaoCopiar" onclick="copiarSenha()">
                Copiar
            </button>
        </div>

        <div class="mt-3 text-muted-custom small">
            No próximo login, o usuário será obrigado a definir uma nova senha.
        </div>

        <div class="d-grid d-sm-flex gap-2 mt-4">
            <a href="{{ url_for('admin_usuarios') }}" class="btn btn-outline-light flex-fill">
                Voltar aos usuários
            </a>
            <a href="{{ url_for('admin_home') }}" class="btn btn-neon flex-fill">
                Ir ao painel
            </a>
        </div>
    </div>

    <script>
        // Troca a URL atual pela listagem. Assim, atualizar a página não reenviará o POST.
        window.history.replaceState(null, "", "{{ url_for('admin_usuarios') }}");

        async function copiarSenha() {
            const senha = document.getElementById("senhaTemporaria").textContent.trim();
            const botao = document.getElementById("botaoCopiar");

            try {
                await navigator.clipboard.writeText(senha);
            } catch (erro) {
                const textarea = document.createElement("textarea");
                textarea.value = senha;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }

            botao.textContent = "Copiada!";
            botao.disabled = true;

            setTimeout(() => {
                botao.textContent = "Copiar";
                botao.disabled = false;
            }, 1800);
        }
    </script>
</body>

</html>
